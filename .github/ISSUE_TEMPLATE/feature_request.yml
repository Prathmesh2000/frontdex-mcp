name: Feature request
description: A new tool, or a change to an existing one
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what frontdex misses today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
  - type: checkboxes
    id: pr
    attributes:
      label: Contribution
      options:
        - label: I would like to open a PR for this
